name: jarvis_app
description: A voice assistant app powered by Gemini.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  google_generative_ai: ^0.4.0
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.0
  battery_plus: ^6.0.2
  external_app_launcher: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
